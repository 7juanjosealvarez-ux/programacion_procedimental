<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pedidos - Juan José Avícola</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="navbar" role="navigation" aria-label="main navigation">
      <div class="navbar-brand">
        <a class="navbar-item" href="index.html"> juan jose avicola </a>
      </div>
      <div class="navbar-menu" id="navbarBasicExample">
        <div class="navbar-start">
          <a class="navbar-item" href="index.html"> Inicio </a>
          <a class="navbar-item" href="menu.html"> Menú </a>
          <a class="navbar-item" href="about.html"> Nosotros </a>
          <a class="navbar-item" href="jobs.html"> Empleo </a>
          <a class="navbar-item" href="contact.html"> Contacto </a>
          <a class="navbar-item" href="inventario.html"> Inventario </a>
          <a class="navbar-item" href="contabilidad.html"> Contabilidad </a>
          <a class="navbar-item" href="pedidos.html" style="color: #48c774;"> Pedidos </a>
        </div>
        <div class="navbar-end">
          <div class="navbar-item">
            <div class="buttons">
              <a class="button" style="background-color: #48c774; color: black; border: none; font-weight: bold;" href="register.html">
                <strong>Ingresar / Registro</strong>
              </a>
            </div>
          </div>
        </div>
      </div>
    </nav>

    <div class="container section">
       <div class="columns is-centered">
         <div class="column is-8">
           <div class="box mt-4 columna-destacada">
             <h1 class="title is-3 has-text-centered page-title mb-5">Registro de Pedidos</h1>
             <p class="subtitle is-6 has-text-centered subtitle-text mb-6">Registra un nuevo pedido ingresando los datos correspondientes.</p>
             
             <form>
               <div class="columns is-multiline">
                 
                 
                 <div class="column is-6">
                   <div class="field">
                     <label class="label has-text-white" for="producto">Producto</label>
                     <div class="control">
                       <input class="input" type="text" id="producto" name="producto" placeholder="Ej. Pechuga de Pollo" required>
                     </div>
                   </div>
                 </div>

                 
                 <div class="column is-6">
                   <div class="field">
                     <label class="label has-text-white" for="cantidad">Cantidad</label>
                     <div class="control">
                       <input class="input" type="number" id="cantidad" name="cantidad" placeholder="Ej. 2" required>
                     </div>
                   </div>
                 </div>

                 
                 <div class="column is-6">
                   <div class="field">
                     <label class="label has-text-white" for="nombre_usuario">Nombre de Usuario</label>
                     <div class="control">
                       <input class="input" type="text" id="nombre_usuario" name="nombre_usuario" placeholder="Ej. Juan Pérez" required>
                     </div>
                   </div>
                 </div>

              
                 <div class="column is-6">
                   <div class="field">
                     <label class="label has-text-white" for="telefono">Teléfono</label>
                     <div class="control">
                       <input class="input" type="tel" id="telefono" name="telefono" placeholder="Ej. 3001234567" required>
                     </div>
                   </div>
                 </div>

              
                 <div class="column is-12">
                   <div class="field">
                     <label class="label has-text-white" for="direccion">Dirección</label>
                     <div class="control">
                       <input class="input" type="text" id="direccion" name="direccion" placeholder="Ej. Calle 123 #45-67" required>
                     </div>
                   </div>
                 </div>

                
                 <div class="column is-12">
                   <div class="field">
                     <label class="label has-text-white" for="metodo_pago">Método de Pago</label>
                     <div class="control">
                       <div class="select is-fullwidth">
                         <select id="metodo_pago" name="metodo_pago" required onchange="toggleSubForm()">
                           <option value="" disabled selected>Selecciona un método de pago</option>
                           <option value="transferencia">Transferencia</option>
                           <option value="tarjeta">Tarjeta de Crédito</option>
                           <option value="efectivo">Efectivo</option>
                         </select>
                       </div>
                     </div>
                   </div>
                 </div>

                
                 <div class="column is-12" id="sub_formulario_transferencia" style="display: none;">
                   <div class="field">
                     <label class="label has-text-white" for="aplicacion_banco">Aplicación / Banco</label>
                     <div class="control">
                       <div class="select is-fullwidth">
                         <select id="aplicacion_banco" name="aplicacion_banco">
                           <option value="" disabled selected>Selecciona la aplicación</option>
                           <option value="davivienda">Davivienda</option>
                           <option value="nequi">Nequi</option>
                           <option value="bancolombia">Bancolombia</option>
                           <option value="banco_de_bogota">Banco de Bogotá</option>
                         </select>
                       </div>
                     </div>
                   </div>
                 </div>

               </div>

               <div class="field is-grouped is-grouped-centered mt-5">
                 <div class="control">
                   <button class="button is-primary is-medium" style="background-color: #48c774; color: black; font-weight: bold;" type="submit">
                     <strong>Guardar Pedido</strong>
                   </button>
                 </div>
                 <div class="control">
                   <a class="button is-dark is-medium" href="index.html">Cancelar</a>
                 </div>
               </div>
               
             </form>
             
           </div>
         </div>
       </div>
    </div>
    <script>
      function toggleSubForm() {
        var metodoPago = document.getElementById("metodo_pago").value;
        var subForm = document.getElementById("sub_formulario_transferencia");
        var appBanco = document.getElementById("aplicacion_banco");
        
        if (metodoPago === "transferencia") {
          subForm.style.display = "block";
          appBanco.setAttribute("required", "required");
        } else {
          subForm.style.display = "none";
          appBanco.removeAttribute("required");
          appBanco.value = "";
        }
      }
    </script>
  </body>
</html>
